        <h1 class="bg-[#DBE5FF] py-12 text-[#043DCD] text-6xl text-center md:text-left px-12 m-4 rounded-lg sm:m-0 sm:rounded-none">Contact</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-1 sm:gap-2 lg:gap-4 xl:gap-12 sm:m-2 md:mx-4">
       <div class="bg-gray-200 p-2 rounded-lg sm:rounded-sm shadow-xl flex items-center justify-between flex-col md:py-24 py-0">
            <div class="text-center m-3">
                    
                    <p class="text-gray-600 py-4">Neem hier contact met me op</p>

        <aside class="bg-gray-200 p-2 rounded-lg sm:rounded-sm shadow-xl">
            <div class="text-center flex items-center justify-center flex-col m-4" id="form">
                <a class="inline-flex items-center gap-2 rounded-lg px-4 py-2 hover:bg-blue-800"> 
                <svg version="1.0" xmlns="http://www.w3.org/2000/svg" width="50.000000pt" height="50.000000pt" viewBox="0 0 500.000000 500.000000"  aria-hidden="true" preserveAspectRatio="xMidYMid meet"> <g transform="translate(0.000000,500.000000) scale(0.100000,-0.100000)" fill="#000000" stroke="none"> <path fill="#2F6DFF" d="M1491 3753 l0 -88 181 -125 182 -125 505 -5 506 -5 55 -26 c102 -49 171 -142 186 -251 10 -75 -25 -176 -84 -235 -64 -66 -126 -93 -228 -101 l-82 -7 46 -32 c257 -174 455 -313 494 -345 105 -87 146 -254 99 -407 -41 -135 -153 -245 -290 -285 -46 -14 -119 -16 -464 -16 l-409 0 -122 -82 c-66 -45 -173 -118 -236 -162 -63 -45 -148 -103 -189 -131 l-73 -50 718 -3 c403 -1 756 2 804 7 283 31 502 213 593 489 18 56 22 89 21 202 -1 127 -3 140 -33 222 -58 156 -157 276 -297 364 l-75 46 59 54 c73 66 136 161 169 256 21 60 26 92 26 178 1 119 -12 191 -53 290 -80 194 -262 359 -465 424 -105 33 -180 36 -862 36 l-683 0 1 -87z"/> <path fill="#3767C7" d="M1480 3226 l0 -265 151 -107 c83 -58 179 -125 213 -147 33 -22 127 -87 207 -143 80 -57 186 -132 237 -166 50 -35 180 -125 289 -201 490 -342 483 -338 533 -331 61 9 86 19 131 55 80 63 102 178 53 277 -33 66 -50 81 -300 252 -115 79 -256 177 -314 217 -58 39 -159 109 -225 154 -66 45 -154 106 -195 134 -413 286 -638 440 -702 484 l-78 52 0 -265z"/><path fill="#3666C6" d="M1480 2087 c0 -388 3 -708 8 -710 6 -5 64 43 330 275 l102 89 0 369 0 369 -117 83 c-65 46 -149 106 -188 133 -38 27 -85 60 -102 73 l-33 24 0 -705z"/></g>
                </svg>

                </a>
                
                    <h2 class="text-xl font-bold"><a href="#form" class="hover:underline hover:text-blue-600">Neem contact met ons op</a></h2>
                    <p class="text-gray-600 py-2"></p>
                    <form action="#" method="get" class="max-w-sm space-y-4">
                        <div class="">
                        <p><label for="onderwerp" class="sr-only font-semibold after:ml-0.5 after:text-red-500 after:content-['*']">waarover gaat je vraag?</label>
                            <br>
                            <select id="onderwerp" name="onderwerp" class="peer mt-1 w-full rounded-md px-3 py-2 user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 after:ml-0.5 after:text-red-500 after:content-['*']user-valid:borded-green-700 text-black">
                            <option value="" class="hover:text-gray-500" selected disabled>Maak een keuze</option>
                            <option value="afspraak" class="">Plan een afspraak</option>
                            <option value="project" class="">Factuur</option>
                            <option value="les">De les</option>
                            </select>
                        </p>
                        <p><label for="naam" class="font-semibold after:ml-0.5 after:text-red-500 after:content-['*']">naam</label>
                        <br>
                        <input type="text" id="naam" name="naam" class="peer mt-1 w-full rounded-md px-3 py-2 user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 user-valid:borded-green-700 " placeholder="Voornaam Achternaam"></p>
                        <p><label>
                        <span class="font-semibold after:ml-0.5 after:text-red-500 after:content-['*']">email</span>
                        <input type="email" id="mail" name="email" required autocomplete="email" aria-describedby="mail-hulp" class="peer mt-1 w-full rounded-md px-3 py-2  user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 user-valid:borded-green-700" placeholder="naam@voorbeeld.com" />
                        </label>
                        <br>
                        </p>
                        <p><label for="gsm" class="font-semibold">tel-nummer</label>
                        <br>
                        <input type="tel" id="gsm" name="gsm" class="peer mt-1 w-full rounded-md px-3 py-2 user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 user-valid:borded-green-700 font-se" placeholder="+32 04-12345678"></p>
                        <p><label for="datum" class="font-semibold">datum</label>
                        <br>
                        <input type="date" id="datum" name="datum" class="text-black hover:text-gray-500 peer mt-1 w-full rounded-md px-3 py-2 user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 user-valid:borded-green-700"></p>
                        <fieldset>
                        <legend>Hoe wil je antwoord krijgen?</legend>
                        <p><input type="checkbox" id="via-tel" name="antwoord" value="telefoon"><label
                        for="via-tel" class="hover:underline px-1">per telefoon</label></p>
                        </fieldset>
                        <p>
                        <label for="bericht">je vraag</label><br>
                        <textarea id="bericht" name="bericht" rows="4" class="peer mt-1 w-full rounded-md px-3 py-2 user-invalid:border-red-700 user-invalid:shadow-red-700 user-invalid:shadow-2xl border border-sky-400 user-valid:borded-green-700">
                        </textarea>
                        </p>
                        <p><input type="checkbox" id="kopie" name="kopie" value="ja"> <label for="kopie">stuur mij een kopie</label></p>
                        <button class="inline-flex items-center gap-2 rounded-lg bg-blue-700 px-4 py-2 text-white hover:bg-blue-800" type="submit">Verstuur  
                        </button>
                    </form>

                </div>
            </div>
